<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家族の医療カード</title>
<meta name="theme-color" content="#7c9a6d">
<meta name="description" content="急な受診・救急搬送のときに見せる、家族の病歴・意向・内服薬のカード">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="医療カード">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --font:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  --bg:#f8f5f0;
  --surface:#fffef9;
  --primary:#7c9a6d;
  --primary-dark:#6a8560;
  --secondary:#d4a96a;
  --text:#3d3530;
  --text-muted:#8c7b72;
  --border:#e8ddd5;
  --radius:16px;
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --alert:#c0392b;
  --alert-bg:#fdecea;
  --alert-border:#e8b4ae;
  --warn:#b7791f;
  --warn-bg:#fdf6e3;
  --warn-border:#e8d6a8;
  --card-fs:1rem;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}

/* ===== ヘッダー ===== */
header{
  background:var(--primary);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 14px 10px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
header .hinner{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:1.05rem;font-weight:900;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:.72rem;opacity:.85}

.swarn{
  background:var(--alert);color:#fff;padding:10px 14px;font-size:.82rem;font-weight:700;
  line-height:1.5;text-align:center;
}
.swarn[hidden]{display:none}

/* ===== メンバータブ ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.chip{
  flex:0 0 auto;padding:8px 16px;border-radius:999px;border:2px solid var(--border);
  background:var(--surface);color:var(--text-muted);font-family:inherit;font-size:.9rem;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.add{border-style:dashed;color:var(--primary);font-weight:700}

/* ===== ツールバー ===== */
.toolbar{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.btn{
  padding:11px 18px;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;
  font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  transition:background .2s,transform .1s;
}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--border)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--alert)}
.btn.danger:hover{background:#a33125}
.btn.sm{padding:7px 13px;font-size:.82rem}
.btn.grow{flex:1}

/* ===== セクション切替 ===== */
.section{display:none}
.section.active{display:block}

/* ===== 救急カード ===== */
.card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 16px;font-size:var(--card-fs);
}
.card .pname{font-size:1.65em;font-weight:900;line-height:1.25;margin:0}
.card .pmeta{margin:4px 0 0;font-size:.92em;color:var(--text-muted);font-weight:500}
.card .pmeta b{color:var(--text);font-weight:700}
.card .updated{margin-top:14px;font-size:.78em;color:var(--text-muted);text-align:right}

.cblock{margin-top:16px;border-top:2px solid var(--border);padding-top:12px}
.cblock:first-of-type{border-top:none}
.cblock h3{
  margin:0 0 8px;font-size:.88em;font-weight:900;letter-spacing:.04em;
  color:var(--text-muted);display:flex;align-items:center;gap:6px;
}
.cblock.alert{
  border:3px solid var(--alert);background:var(--alert-bg);border-radius:12px;
  padding:12px;margin-top:12px;
}
.cblock.alert h3{color:var(--alert);font-size:1em}
.cblock.warn{
  border:3px solid var(--warn-border);background:var(--warn-bg);border-radius:12px;
  padding:12px;margin-top:12px;
}
.cblock.warn h3{color:var(--warn);font-size:1em}
.cblock.ok{
  border:3px solid var(--primary);background:#f1f6ee;border-radius:12px;
  padding:12px;margin-top:12px;
}
.cblock.ok h3{color:var(--primary-dark);font-size:1em}
.hero{font-size:1.15em;font-weight:900;line-height:1.5}
.none{color:var(--text-muted);font-weight:500;font-size:.95em}
.okmsg{font-weight:900;font-size:1.08em;color:var(--primary-dark)}
.unknown{font-weight:900;font-size:1.02em;color:var(--alert)}

.rows{display:flex;flex-direction:column;gap:7px}
.row{
  background:var(--bg);border-radius:9px;padding:9px 11px;
  border-left:5px solid var(--primary);
}
.cblock.alert .row{background:#fff;border-left-color:var(--alert)}
.cblock.warn .row{background:#fff;border-left-color:var(--warn)}
.row .t{font-weight:900;font-size:1.02em;line-height:1.35}
.row .s{font-size:.86em;color:var(--text-muted);margin-top:2px;line-height:1.5}
.row .tag{
  display:inline-block;background:var(--alert);color:#fff;font-size:.72em;font-weight:900;
  padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;
}
.row .tag.g{background:var(--primary)}
.row .tag.y{background:var(--warn)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.95em}
.kv dt{color:var(--text-muted);font-weight:500;white-space:nowrap}
.kv dd{margin:0;font-weight:700}
.kv dd.no{font-weight:500;color:var(--text-muted)}
.acpgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.acpitem{background:#fff;border-radius:9px;padding:7px 10px;border:1px solid var(--warn-border)}
.acpitem .l{font-size:.78em;color:var(--text-muted)}
.acpitem .v{font-weight:900;font-size:1em;line-height:1.3}
.acpitem .v.yes{color:var(--primary-dark)}
.acpitem .v.no{color:var(--alert)}
a.tel{color:var(--primary-dark);font-weight:900;text-decoration:none;border-bottom:2px solid var(--border)}

/* ===== お薬手帳の写真 ===== */
.cardphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardphotos img{
  width:100%;height:auto;max-height:300px;object-fit:contain;background:#f2f2f2;
  border:1px solid var(--border);border-radius:9px;cursor:zoom-in;display:block;
}
.photobox{border-top:2px dashed var(--border);margin-top:14px;padding-top:12px}
.photolabel{font-size:.82rem;font-weight:900;color:var(--text-muted);margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:10px}
.photo{position:relative;border:2px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.photo img{width:100%;height:104px;object-fit:cover;display:block;cursor:zoom-in}
.photo .del{
  position:absolute;top:3px;right:3px;width:26px;height:26px;border:none;border-radius:50%;
  background:rgba(192,57,43,.92);color:#fff;font-size:1rem;font-weight:900;line-height:1;
  cursor:pointer;font-family:inherit;
}
.hint{font-size:.74rem;color:var(--text-muted);margin:8px 0 0;line-height:1.5}
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9998;
  display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out;
}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .close{
  position:absolute;top:14px;right:16px;background:#fff;color:#000;border:none;
  border-radius:999px;padding:8px 18px;font-family:inherit;font-weight:900;cursor:pointer;
}

/* ===== 編集 ===== */
.note{
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;
  padding:10px 12px;font-size:.8rem;color:var(--warn);margin-bottom:14px;line-height:1.5;
}
.acc{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc>summary{
  padding:14px 16px;font-weight:900;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:9px;font-size:.98rem;
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'＋';margin-left:auto;color:var(--text-muted);font-weight:700}
.acc[open]>summary::after{content:'−'}
.acc>summary .cnt{
  font-size:.72rem;background:var(--primary);color:#fff;border-radius:999px;
  padding:1px 9px;font-weight:700;
}
.accbody{padding:0 16px 16px}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:3px}
.f.full{grid-column:1/-1}
.f label{font-size:.76rem;font-weight:700;color:var(--text-muted)}
.input{
  width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:8px;
  font-size:.95rem;font-family:inherit;color:var(--text);background:#fff;
  transition:border-color .2s;
}
.input:focus{outline:none;border-color:var(--primary)}
textarea.input{min-height:64px;resize:vertical}
.ymd{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.ymd select{padding:11px 8px;font-size:1rem;text-align:center;text-align-last:center}
.chk{
  grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--alert-bg);
  border:2px solid var(--alert-border);border-radius:8px;padding:8px 11px;
}
.chk input{width:20px;height:20px;accent-color:var(--alert);flex:0 0 auto}
.chk label{font-size:.85rem;font-weight:900;color:var(--alert)}
.chk.ok{background:#eef4ea;border-color:#c5d8bb;margin-bottom:12px}
.chk.ok input{accent-color:var(--primary)}
.chk.ok label{color:var(--primary-dark)}
.acc>summary .cnt.zero{background:var(--text-muted)}

.litem{border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.litem .lhead{display:flex;align-items:center;margin-bottom:9px}
.litem .lhead span{font-size:.78rem;font-weight:900;color:var(--text-muted)}
.litem .lhead button{margin-left:auto}
.empty{color:var(--text-muted);font-size:.85rem;padding:6px 0 12px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#2d3748;color:#fff;padding:12px 24px;border-radius:999px;font-size:.88rem;
  font-weight:700;transition:transform .3s;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .fgrid{grid-template-columns:1fr}
  .acpgrid{grid-template-columns:1fr}
}

@media print{
  header,.chips,.toolbar,.note,.no-print{display:none!important}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;padding:0;font-size:11pt}
  .cblock{break-inside:avoid;page-break-inside:avoid}
  .cblock.alert,.cblock.warn{border-width:2px}
  .row{background:#fff!important;border:1px solid #ccc;border-left-width:4px}
  .cardphotos img{max-height:none}
  .lightbox{display:none!important}
}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <h1>🏥 家族の医療カード</h1>
    <p>急な受診・救急搬送のときに、この画面を見せてください</p>
  </div>
</header>

<div class="swarn" id="storageWarn" hidden role="alert">
  ⚠️ この画面では入力を保存できません。入力内容はページを閉じると消えます。<br>
  ブラウザ（Safari / Chrome）でこのページのURLを直接開いてからご利用ください。
</div>

<div class="wrap">
  <div class="chips" id="chips" role="tablist" aria-label="家族の切り替え"></div>

  <!-- ===== 救急カード ===== -->
  <div class="section active" id="sec-card">
    <div class="toolbar no-print">
      <button class="btn ghost sm" id="btnEdit">✏️ 編集</button>
      <button class="btn ghost sm" id="btnFont">🔍 文字を大きく</button>
      <button class="btn ghost sm" id="btnPrint">🖨 印刷</button>
      <button class="btn ghost sm" id="btnSync" hidden>🔄 同期</button>
    </div>
    <div class="card" id="card" aria-live="polite"></div>
  </div>

  <!-- ===== 編集 ===== -->
  <div class="section" id="sec-edit">
    <div class="note">
      入力した内容は<b>この端末のブラウザの中だけ</b>に保存されます（外部には一切送信されません）。
      入力はそのつど自動保存され、「保存」でカード画面にもどります。
    </div>
    <details class="acc" id="syncBox">
      <summary>☁️ 家族と共有<span class="cnt zero" id="syncBadge">未設定</span></summary>
      <div class="accbody">
        <div class="f full">
          <label for="passInput">家族の合言葉</label>
          <input class="input" id="passInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="例）nada-0000-0000">
        </div>
        <div class="toolbar" style="margin:10px 0 0">
          <button class="btn sm" id="btnSyncOn">この端末で共有をはじめる</button>
          <button class="btn danger sm" id="btnSyncOff" hidden>共有をやめる</button>
        </div>
        <p class="hint" id="syncInfo">同じ合言葉を入れた家族の端末どうしで、カードの内容が共有されます。<br>※お薬手帳の写真は共有されず、撮った端末にだけ残ります。</p>
      </div>
    </details>

    <div id="editor"></div>
    <div class="toolbar">
      <button class="btn grow" id="btnSave">✓ 保存</button>
      <button class="btn danger sm" id="btnDelMember">この人を削除</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-label="お薬手帳の写真">
  <button class="close" id="lightboxClose">閉じる</button>
  <img id="lightboxImg" alt="お薬手帳の写真">
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== 状態 ===================== */
const KEY = 'famcard_v1';
const ACP_OPTS = ['未記入','希望する','希望しない','状況による','本人と相談中'];

const SCHEMA = [
  { id:'basic', title:'基本情報', icon:'👤', type:'form', fields:[
    {k:'name',l:'氏名',t:'text',ph:'山田 花子'},
    {k:'kana',l:'ふりがな',t:'text',ph:'やまだ はなこ'},
    {k:'birth',l:'生年月日',t:'ymd'},
    {k:'sex',l:'性別',t:'select',opts:['','男性','女性','その他']},
    {k:'blood',l:'血液型',t:'select',opts:['','A型 Rh+','A型 Rh−','B型 Rh+','B型 Rh−','O型 Rh+','O型 Rh−','AB型 Rh+','AB型 Rh−','不明']},
    {k:'height',l:'身長（cm）',t:'number'},
    {k:'weight',l:'体重（kg）',t:'number'},
    {k:'phone',l:'本人の電話',t:'tel'},
    {k:'address',l:'住所',t:'text',full:true},
    {k:'topnote',l:'まず最初に伝えたいこと',t:'area',full:true,ph:'例）話すことはできますが、耳が遠く大きな声が必要です'}
  ]},
  { id:'allergies', title:'アレルギー・薬剤副作用', icon:'⚠️', type:'list', unit:'アレルギー', noneable:true, noneLabel:'アレルギー・副作用は「なし」（確認済み）', fields:[
    {k:'item',l:'原因（薬剤名・食品名など）',t:'text',full:true,ph:'ペニシリン／そば'},
    {k:'kind',l:'種別',t:'select',opts:['薬剤','食物','造影剤','ラテックス','その他']},
    {k:'severity',l:'重症度',t:'select',opts:['','軽度','中等度','重度（アナフィラキシー）']},
    {k:'reaction',l:'症状',t:'text',full:true,ph:'発疹／呼吸困難'}
  ]},
  { id:'meds', title:'内服薬・処方', icon:'💊', type:'list', unit:'薬', noneable:true, noneLabel:'内服薬は「なし」（確認済み）', photos:true, fields:[
    {k:'name',l:'薬剤名',t:'text',ph:'エリキュース錠'},
    {k:'dose',l:'規格・1回量',t:'text',ph:'5mg 1錠'},
    {k:'timing',l:'服用時点',t:'text',ph:'朝夕食後'},
    {k:'purpose',l:'目的・対象の病気',t:'text',ph:'心房細動'},
    {k:'prescriber',l:'処方元',t:'text',ph:'○○内科'},
    {k:'start',l:'開始時期',t:'text',ph:'2024年4月'},
    {k:'alert',l:'抗凝固薬・抗血小板薬（血をサラサラにする薬）',t:'check'},
    {k:'note',l:'メモ（最終内服日時など）',t:'text',full:true}
  ]},
  { id:'conditions', title:'病歴・現在の病気', icon:'🩺', type:'list', unit:'病名', noneable:true, noneLabel:'病歴・持病は「なし」（確認済み）', fields:[
    {k:'name',l:'病名',t:'text',full:true,ph:'心房細動'},
    {k:'status',l:'状態',t:'select',opts:['治療中','経過観察','既往（治癒）']},
    {k:'year',l:'発症・診断時期',t:'text',ph:'2020年'},
    {k:'hospital',l:'病院・主治医',t:'text',full:true},
    {k:'note',l:'メモ',t:'text',full:true}
  ]},
  { id:'acp', title:'本人の意向（ACP・事前指示）', icon:'🕊', type:'form', fields:[
    {k:'cpr',l:'心肺蘇生（心臓マッサージ）',t:'select',opts:ACP_OPTS},
    {k:'intubation',l:'気管挿管・人工呼吸器',t:'select',opts:ACP_OPTS},
    {k:'feeding',l:'人工栄養（胃ろう・経鼻・点滴）',t:'select',opts:ACP_OPTS},
    {k:'transfusion',l:'輸血',t:'select',opts:ACP_OPTS},
    {k:'dialysis',l:'透析',t:'select',opts:ACP_OPTS},
    {k:'hospitalize',l:'入院',t:'select',opts:ACP_OPTS},
    {k:'place',l:'最期を過ごしたい場所',t:'text',full:true,ph:'自宅で過ごしたい'},
    {k:'proxy',l:'代理意思決定者（氏名・続柄・電話）',t:'text',full:true},
    {k:'notify',l:'病名告知の希望',t:'select',full:true,opts:['未記入','本人に伝えてほしい','本人には伝えないでほしい','家族と相談してほしい']},
    {k:'doc',l:'事前指示書・リビングウィル（有無と保管場所）',t:'text',full:true},
    {k:'values',l:'本人が大切にしていること',t:'area',full:true,ph:'例）痛みや苦しみがないことを一番に望んでいる'},
    {k:'talkedAt',l:'話し合った日・同席者',t:'text',full:true,ph:'2026年3月 本人・長女・主治医'}
  ]},
  { id:'contacts', title:'連絡先（かかりつけ・家族）', icon:'📞', type:'list', unit:'連絡先', fields:[
    {k:'kind',l:'区分',t:'select',opts:['家族','かかりつけ医','専門病院','訪問看護','ケアマネジャー','調剤薬局','その他']},
    {k:'name',l:'名称・氏名',t:'text'},
    {k:'phone',l:'電話番号',t:'tel'},
    {k:'note',l:'メモ（担当者・診察日など）',t:'text',full:true}
  ]},
  { id:'devices', title:'体内デバイス・医療処置（MRI可否）', icon:'🔧', type:'list', unit:'デバイス', noneable:true, noneLabel:'体内デバイス・医療処置は「なし」（確認済み）', fields:[
    {k:'name',l:'種類',t:'text',full:true,ph:'ペースメーカー／ステント／人工関節／シャント／CVポート／胃ろう／ストーマ'},
    {k:'site',l:'部位',t:'text'},
    {k:'year',l:'留置時期',t:'text'},
    {k:'mri',l:'MRI',t:'select',opts:['不明','可','条件付き可','不可']},
    {k:'note',l:'メモ（機種・手帳の保管場所）',t:'text',full:true}

/* ===================== ユーティリティ ===================== */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    return true;
  }catch(e){
    if(e && (e.name === 'QuotaExceededError' || e.code === 22)){
      showToast('保存できませんでした（写真の枚数が多すぎます）', 3500);
    }else{
      showToast('この画面では保存できません。ブラウザでURLを直接開いてください', 4000);
      storageOK = false;
      document.getElementById('storageWarn').hidden = false;
    }
    return false;
  }
}

/* この環境で保存できるかを起動時に判定 */
let storageOK = true;
function checkStorage(){
  try{
    localStorage.setItem('__famcard_test', '1');
    localStorage.removeItem('__famcard_test');
    return true;
  }catch(e){ return false; }
}
function loadState(){
  try{
    const v = localStorage.getItem(KEY);
    const d = v ? JSON.parse(v) : null;
    if(d && Array.isArray(d.members) && d.members.length) return normalize(d);
  }catch(e){ /* 壊れていたら初期化 */ }
  return { version:1, members:[ newMember() ] };
}
function normalize(d){
  d.members.forEach(m => {
    if(!m.id) m.id = uid();
    if(!m.none || typeof m.none !== 'object') m.none = {};
    if(!Array.isArray(m.medPhotos)) m.medPhotos = [];
    SCHEMA.forEach(s => {
      if(s.type === 'list'){ if(!Array.isArray(m[s.id])) m[s.id] = []; }
      else if(!m[s.id] || typeof m[s.id] !== 'object'){ m[s.id] = {}; }
    });
  });
  return d;
}
function newMember(){
  const m = { id:uid(), updatedAt:'', none:{}, medPhotos:[] };
  SCHEMA.forEach(s => { m[s.id] = s.type === 'list' ? [] : {}; });
  m.basic.name = '';
  return m;
}
function liveMembers(){ return state.members.filter(m => !m.deleted); }
function cur(){
  const live = liveMembers();
  return live.find(m => m.id === curId) || live[0] || state.members[0];
}
function touch(){
  const m = cur();
  if(m) m.updatedAt = formatDate();
  save();
}
function formatDate(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function age(birth){
  if(!birth) return '';
  const b = new Date(birth);
  if(isNaN(b.getTime())) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const md = t.getMonth() - b.getMonth();
  if(md < 0 || (md === 0 && t.getDate() < b.getDate())) a--;
  return (a >= 0 && a < 130) ? a + '歳' : '';
}
function jpDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d.getTime())) return v;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._id);
  showToast._id = setTimeout(() => t.classList.remove('show'), ms || 2200);
}
function showSection(id){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function nonEmpty(obj, keys){
  return keys.some(k => String((obj && obj[k]) || '').trim() !== '');
}

/* 年・月・日をそれぞれドラムで選ぶ入力 */
function parseYMD(v){
  const mt = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v||''));
  return mt ? { y:+mt[1], m:+mt[2], d:+mt[3] } : { y:'', m:'', d:'' };
}
function daysInMonth(y, m){
  if(!m) return 31;
  return new Date(y || 2024, m, 0).getDate();
}
function ymdHTML(sec, f, val, idx, id, dataAttr){
  const c = parseYMD(val);
  const thisYear = new Date().getFullYear();
  let ys = '<option value="">年</option>';
  for(let y = thisYear; y >= thisYear - 120; y--){
    ys += '<option value="'+y+'"'+(c.y === y ? ' selected' : '')+'>'+y+'年</option>';
  }
  let ms = '<option value="">月</option>';
  for(let m = 1; m <= 12; m++){
    ms += '<option value="'+m+'"'+(c.m === m ? ' selected' : '')+'>'+m+'月</option>';
  }
  let ds = '<option value="">日</option>';
  const dim = daysInMonth(c.y, c.m);
  for(let d = 1; d <= dim; d++){
    ds += '<option value="'+d+'"'+(c.d === d ? ' selected' : '')+'>'+d+'日</option>';
  }
  const sel = (part, opts) =>
    '<select class="input" '+dataAttr+' data-ymd="'+part+'" aria-label="'+esc(f.l)+'の'+
    (part==='y'?'年':part==='m'?'月':'日')+'">'+opts+'</select>';
  return '<div class="f full"><label id="'+id+'_lbl">'+esc(f.l)+'</label>'+
    '<div class="ymd" role="group" aria-labelledby="'+id+'_lbl">'+
      sel('y', ys) + sel('m', ms) + sel('d', ds) +
    '</div></div>';
}

function fieldHTML(sec, f, val, idx){
  const id = 'f_'+sec+'_'+f.k+(idx!=null?'_'+idx:'');
  const dataAttr = 'data-sec="'+esc(sec)+'" data-k="'+esc(f.k)+'"'+(idx!=null?' data-i="'+idx+'"':'');
  if(f.t === 'ymd') return ymdHTML(sec, f, val, idx, id, dataAttr);
  if(f.t === 'check'){
    return '<div class="chk"><input type="checkbox" id="'+id+'" '+dataAttr+(val?' checked':'')+'>'+
           '<label for="'+id+'">'+esc(f.l)+'</label></div>';
  }
  let inner;
  if(f.t === 'select'){
    inner = '<select class="input" id="'+id+'" '+dataAttr+'>' +
      f.opts.map(o => '<option value="'+esc(o)+'"'+(String(val||'')===o?' selected':'')+'>'+esc(o||'—')+'</option>').join('') +
      '</select>';
  }else if(f.t === 'area'){
    inner = '<textarea class="input" id="'+id+'" '+dataAttr+' placeholder="'+esc(f.ph||'')+'">'+esc(val||'')+'</textarea>';
  }else{
    inner = '<input class="input" type="'+esc(f.t)+'" id="'+id+'" '+dataAttr+
            ' value="'+esc(val||'')+'" placeholder="'+esc(f.ph||'')+'">';
  }
  return '<div class="f'+(f.full?' full':'')+'"><label for="'+id+'">'+esc(f.l)+'</label>'+inner+'</div>';
}

/* ===== お薬手帳の写真 ===== */
const MAX_PHOTOS = 8;

function photoEditorHTML(m){
  const ps = m.medPhotos || [];
  return '<div class="photobox">' +
    '<div class="photolabel">📷 お薬手帳の写真（' + ps.length + '／' + MAX_PHOTOS + '枚）</div>' +
    (ps.length
      ? '<div class="photos">' + ps.map((p,i) =>
          '<div class="photo"><img src="' + esc(p.data) + '" alt="お薬手帳 ' + (i+1) + '枚目" data-zoom="' + i + '">' +
          '<button class="del" data-delphoto="' + i + '" aria-label="' + (i+1) + '枚目の写真を削除">×</button></div>'
        ).join('') + '</div>'
      : '<p class="empty">写真はまだありません</p>') +
    '<input type="file" id="photoInput" accept="image/*" hidden>' +
    '<button class="btn sm" id="btnAddPhoto"' + (ps.length >= MAX_PHOTOS ? ' disabled' : '') + '>＋ 写真を撮る／選ぶ</button>' +
    '<p class="hint">お薬手帳のページを撮影して登録できます。写真は自動で縮小され、この端末の中だけに保存されます。</p>' +
  '</div>';
}

function shrinkImage(file, maxEdge, quality){
  return new Promise((resolve, reject) => {
    if(!file || !/^image\//.test(file.type)) { reject(new Error('画像ではありません')); return; }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('読み込めませんでした'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を開けませんでした'));
      img.onload = () => {
        let w = img.naturalWidth, hgt = img.naturalHeight;
        const scale = Math.min(1, maxEdge / Math.max(w, hgt));
        w = Math.max(1, Math.round(w * scale));
        hgt = Math.max(1, Math.round(hgt * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hgt;
        cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function addPhoto(file){
  const m = cur();
  if((m.medPhotos||[]).length >= MAX_PHOTOS){ showToast('写真は' + MAX_PHOTOS + '枚までです'); return; }
  showToast('写真を取り込んでいます…', 4000);
  try{
    const data = await shrinkImage(file, 1400, 0.72);
    m.medPhotos.push({ data:data, at:formatDate() });
    if(save()){
      m.updatedAt = formatDate();
      save();
      showToast('写真を追加しました');
    }else{
      m.medPhotos.pop();
    }
  }catch(err){
    showToast('写真を取り込めませんでした');
  }
  renderEditor(); reopen('meds');
}

function renderEditor(){
  const m = cur();
  const el = document.getElementById('editor');
  if(!m){ el.innerHTML = ''; return; }

  el.innerHTML = SCHEMA.map(s => {
    let body;
    if(s.type === 'form'){
      body = '<div class="fgrid">' + s.fields.map(f => fieldHTML(s.id, f, (m[s.id]||{})[f.k])).join('') + '</div>';
    }else{
      const arr = m[s.id] || [];
      const isNone = !!(m.none||{})[s.id];
      const noneChk = s.noneable
        ? '<div class="chk ok"><input type="checkbox" id="none_'+esc(s.id)+'" data-sec="none" data-k="'+esc(s.id)+'"'+(isNone?' checked':'')+'>'+
          '<label for="none_'+esc(s.id)+'">'+esc(s.noneLabel || '該当なし（確認済み）')+'</label></div>'
        : '';
      const list = (arr.length ? arr.map((row,i) =>
        '<div class="litem"><div class="lhead"><span>'+esc(s.unit)+' '+(i+1)+'</span>'+
        '<button class="btn danger sm" data-del="'+esc(s.id)+'" data-i="'+i+'">削除</button></div>'+
        '<div class="fgrid">' + s.fields.map(f => fieldHTML(s.id, f, row[f.k], i)).join('') + '</div></div>'
      ).join('') : '<p class="empty">まだ登録がありません</p>') +
      '<button class="btn sm" data-add="'+esc(s.id)+'">＋ '+esc(s.unit)+'を追加</button>';
      body = noneChk + (isNone ? '<p class="empty">カードには「なし（確認済み）」と表示されます。</p>' : list)
           + (s.photos ? photoEditorHTML(m) : '');
    }
    const cnt = s.type !== 'list' ? ''
      : ((m.none||{})[s.id] ? '<span class="cnt zero">なし</span>'
        : ((m[s.id]||[]).length ? '<span class="cnt">'+(m[s.id].length)+'</span>' : ''));
    const open = (s.id === 'basic') ? ' open' : '';
    return '<details class="acc"'+open+'><summary>'+esc(s.icon)+' '+esc(s.title)+cnt+'</summary>'+
           '<div class="accbody">'+body+'</div></details>';
  }).join('');
}

function onEdit(e){
  const t = e.target;
  const sec = t.dataset.sec, k = t.dataset.k;
  if(!sec || !k) return;
  const m = cur();
  let val = (t.type === 'checkbox') ? t.checked : t.value;

  /* 年・月・日の3つから生年月日を組み立てる */
  if(t.dataset.ymd){
    const group = t.closest('.ymd');
    const get = part => group.querySelector('[data-ymd="'+part+'"]').value;
    const y = get('y'), mo = get('m');
    if(t.dataset.ymd !== 'd'){
      /* 月末の日数に合わせて「日」の選択肢を作り直す */
      const dSel = group.querySelector('[data-ymd="d"]');
      const keep = dSel.value;
      const dim = daysInMonth(y, Number(mo));
      let ds = '<option value="">日</option>';
      for(let d = 1; d <= dim; d++) ds += '<option value="'+d+'">'+d+'日</option>';
      dSel.innerHTML = ds;
      dSel.value = (keep && Number(keep) <= dim) ? keep : '';
    }
    const d = get('d');
    const p2 = n => String(n).padStart(2, '0');
    val = (y && mo && d) ? (y + '-' + p2(mo) + '-' + p2(d)) : '';
  }

  if(t.dataset.i != null){
    const i = Number(t.dataset.i);
    if(!m[sec][i]) return;
    m[sec][i][k] = val;
  }else{
    m[sec][k] = val;
  }
  touch();
  if(sec === 'basic' && k === 'name') renderChips();
  if(sec === 'none'){ renderEditor(); reopen(k); }
  clearTimeout(onEdit._t);
  onEdit._t = setTimeout(() => showToast('保存しました'), 600);
}

/* ===================== 家族との共有 ===================== */
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxJJSCuXZ1u39WQfjr-BihBztrbQY2lLosWRmZMbH6EE1Y02ap0gezvnXFMamfYTHeE/exec';
const PASS_KEY = 'famcard_pass';
const SYNCAT_KEY = 'famcard_synced_at';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

let syncPass = lsGet(PASS_KEY) || '';
let syncing = false;

/* 写真は通信量が大きいため共有しない（撮った端末にだけ残す） */
function forServer(st){
  return {
    version: 1,
    members: (st.members || []).filter(m => !isUntouched(m)).map(m => {
      const c = {};
      for(const k in m){ if(k !== 'medPhotos') c[k] = m[k]; }
      return c;
    })
  };
}

/* 一度も触っていない空の枠（初回起動時の1人）は共有しない */
function isUntouched(m){
  return !m.updatedAt && !((m.basic || {}).name || '').trim();
}

/* 同じ人は「更新が新しい方」を採用して突き合わせる */
function mergeStates(local, server){
  const byId = {};
  ((server && server.members) || []).forEach(m => { if(m && m.id) byId[m.id] = m; });
  (local.members || []).forEach(m => {
    const s = byId[m.id];
    if(!s || String(m.updatedAt || '') > String(s.updatedAt || '')) byId[m.id] = m;
  });

  const localPhotos = {};
  (local.members || []).forEach(m => {
    if(Array.isArray(m.medPhotos) && m.medPhotos.length) localPhotos[m.id] = m.medPhotos;
  });

  let members = Object.keys(byId).map(id => {
    const m = Object.assign({}, byId[id]);
    if(!Array.isArray(m.medPhotos) || !m.medPhotos.length) m.medPhotos = localPhotos[id] || [];
    return m;
  });
  const touched = members.filter(m => !isUntouched(m));
  if(touched.length) members = touched;
  return { version: 1, members: members };
}

async function syncNow(silent){
  if(!syncPass || syncing) return false;
  if(!navigator.onLine){
    if(!silent) showToast('オフラインのため同期できません');
    return false;
  }
  syncing = true;
  const btn = document.getElementById('btnSync');
  if(btn) btn.textContent = '🔄 同期中…';
  try{
    const res = await fetch(SYNC_URL + '?action=load&pass=' + encodeURIComponent(syncPass))
      .then(r => r.json());
    if(!res.ok){
      showToast(res.error === 'bad_pass' ? '合言葉が違います' : '同期できませんでした');
      return false;
    }
    if(res.payload){
      state = normalize(mergeStates(state, res.payload));
      if(!liveMembers().length) state.members.push(newMember());
      curId = (cur() || {}).id;
      save();
    }
    const push = await fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save', pass: syncPass, payload: forServer(state) })
    }).then(r => r.json());

    if(!push.ok){
      showToast(push.error === 'too_big' ? '内容が大きすぎて共有できません' : '同期できませんでした');
      return false;
    }
    lsSet(SYNCAT_KEY, formatDate());
    renderAll();
    if(!silent) showToast('同期しました');
    return true;
  }catch(e){
    if(!silent) showToast('同期できませんでした（通信エラー）');
    return false;
  }finally{
    syncing = false;
    if(btn) btn.textContent = '🔄 同期';
    renderSyncUI();
  }
}

function renderSyncUI(){
  const on = !!syncPass;
  document.getElementById('btnSync').hidden = !on;
  document.getElementById('btnSyncOff').hidden = !on;
  document.getElementById('btnSyncOn').textContent = on ? '合言葉を入れ直す' : 'この端末で共有をはじめる';
  document.getElementById('passInput').value = syncPass;
  const badge = document.getElementById('syncBadge');
  badge.textContent = on ? '共有中' : '未設定';
  badge.className = on ? 'cnt' : 'cnt zero';
  const at = lsGet(SYNCAT_KEY);
  document.getElementById('syncInfo').innerHTML = on
    ? '共有中です。' + (at ? '最終同期：' + esc(at) : 'まだ同期していません') +
      '<br>同じ合言葉を入れた家族の端末と、カードの内容が共有されます。<br>※お薬手帳の写真は共有されず、撮った端末にだけ残ります。'
    : '同じ合言葉を入れた家族の端末どうしで、カードの内容が共有されます。<br>※お薬手帳の写真は共有されず、撮った端末にだけ残ります。';
}

document.getElementById('btnSyncOn').onclick = async () => {
  const v = document.getElementById('passInput').value.trim();
  if(!v){ showToast('合言葉を入れてください'); return; }
  syncPass = v;
  const ok = await syncNow(false);
  if(ok){ lsSet(PASS_KEY, v); }
  else if(!lsGet(PASS_KEY)){ syncPass = ''; }
  renderSyncUI();
};

document.getElementById('btnSyncOff').onclick = () => {
  if(!confirm('この端末での共有をやめます。カードの内容はこの端末に残ります。')) return;
  syncPass = '';
  lsDel(PASS_KEY); lsDel(SYNCAT_KEY);
  renderSyncUI();
  showToast('共有をやめました');
};

document.getElementById('btnSync').onclick = () => syncNow(false);
window.addEventListener('online', () => syncNow(true));

  });
